<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAHAD — Developer</title>
<meta name="description" content="FAHAD — Developer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root{
    --h:222;
    --bs:65%;
    --ls:100%;
    --rgb:47,107,255;
    --blue:#2f6bff;
    --on-accent:#fff;
    --deep:hsl(var(--h) 75% 40%);
    --bg:hsl(var(--h) var(--bs) 5%);
    --panel:hsl(var(--h) var(--bs) 22% / .28);
    --line:hsl(var(--h) var(--ls) 70% / .22);
    --blue-soft:hsl(var(--h) var(--ls) 74%);
    --ice:hsl(var(--h) var(--ls) 96%);
    --muted:hsl(var(--h) calc(var(--bs) * .4) 66%);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Tajawal",system-ui,sans-serif;
    background:
      radial-gradient(900px 600px at 15% 30%, rgba(var(--rgb),.22), transparent 60%),
      radial-gradient(700px 500px at 85% 80%, hsl(var(--h) var(--bs) 40% / .18), transparent 60%),
      var(--bg);
    color:var(--ice);
    min-height:100vh;
    overflow-x:hidden;
    line-height:1.7;
  }
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--blue-soft);outline-offset:3px}

  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  /* ---------- NAV ---------- */
  .nav{
    position:sticky;top:0;z-index:20;
    backdrop-filter:blur(14px);
    background:hsl(var(--h) var(--bs) 5% / .7);
    border-bottom:1px solid var(--line);
  }
  .nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
  .nav__links{display:flex;gap:26px;align-items:center;color:var(--muted);font-weight:500}
  .nav__links a:hover{color:var(--ice)}
  .pill-kick{
    background:var(--blue);color:var(--on-accent);font-weight:900;
    padding:7px 18px;border-radius:10px;font-size:.92rem;
  }
  .nav__links a.pill-kick:hover{color:var(--on-accent);filter:brightness(1.12)}


  /* ---------- THEME PICKER ---------- */
  .theme{position:relative}
  .theme__btn{
    display:flex;align-items:center;gap:8px;cursor:pointer;font-family:inherit;
    background:var(--panel);border:1px solid var(--line);color:var(--ice);
    padding:6px 12px;border-radius:10px;font-size:.85rem;font-weight:700;
  }
  .theme__dot{width:16px;height:16px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px rgba(var(--rgb),.7)}
  .theme__pop{
    position:absolute;top:calc(100% + 10px);inset-inline-start:0;z-index:30;width:236px;
    background:hsl(var(--h) var(--bs) 8% / .97);border:1px solid var(--line);
    border-radius:14px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.55);
    display:none;
  }
  .theme.open .theme__pop{display:block}
  .theme__title{font-size:.85rem;color:var(--muted);margin-bottom:12px}
  .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .swatch{
    width:100%;aspect-ratio:1;border-radius:50%;cursor:pointer;
    border:2px solid transparent;background:var(--c);
  }
  .swatch[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--c)}
  .custom{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
    font-size:.85rem;color:var(--muted);
  }
  .custom input{
    width:46px;height:32px;padding:0;border:1px solid var(--line);border-radius:8px;
    background:none;cursor:pointer;
  }


  /* ---------- EFFECTS ---------- */
  #fxBack,#fxFront{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #fxBack{z-index:0}
  #fxFront{z-index:2}
  main,footer{position:relative;z-index:1}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    padding:6px 14px;border-radius:999px;cursor:pointer;font-family:inherit;
    font-size:.82rem;font-weight:700;color:var(--ice);
    background:var(--panel);border:1px solid var(--line);
  }
  .chip[aria-pressed="true"]{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}

  /* ---------- HERO ---------- */
  .hero{padding:72px 0 40px}
  .hero__grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}

  .tag-top{
    display:inline-flex;align-items:center;gap:8px;
    border:1px solid var(--line);background:var(--panel);
    padding:6px 14px;border-radius:999px;
    font-size:.78rem;color:var(--blue-soft);font-weight:700;
  }
  .tag-top i{
    width:8px;height:8px;border-radius:50%;background:var(--blue);
    box-shadow:0 0 0 0 rgba(var(--rgb),.7);animation:pulse 2s infinite;
  }
  @keyframes pulse{70%{box-shadow:0 0 0 10px rgba(var(--rgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--rgb),0)}}

  .hero__name{
    font-family:"Anton",sans-serif;
    font-size:clamp(4.5rem,13vw,10rem);
    line-height:.95;letter-spacing:.01em;
    margin:18px 0 6px;direction:ltr;text-align:right;
    background:linear-gradient(180deg,#ffffff 15%,var(--blue-soft) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 30px rgba(var(--rgb),.45));
  }
  .hero__ar{
    display:flex;align-items:center;gap:16px;
    font-size:clamp(2.4rem,6vw,4rem);font-weight:900;
  }
  .hero__ar svg{width:.9em;height:.9em;fill:#fff;filter:drop-shadow(0 0 14px rgba(255,255,255,.55))}

  .tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
  .tag{
    border:1px solid var(--line);background:var(--panel);
    padding:5px 14px;border-radius:9px;font-size:.78rem;color:var(--blue-soft);font-weight:700;
  }

  [hidden]{display:none !important}
  .views{display:inline-flex;align-items:center;gap:7px;direction:ltr}
  .views svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .views b{color:var(--ice)}
  .views-row{margin-top:28px;display:flex;justify-content:center}

  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
  .btn{
    padding:13px 26px;border-radius:12px;font-weight:900;font-size:1rem;
    border:0;cursor:pointer;font-family:inherit;transition:transform .15s, filter .15s;
  }
  .btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
  .btn--kick{background:var(--ice);color:hsl(var(--h) var(--bs) 10%)}
  .btn--blue{background:linear-gradient(140deg,var(--blue),var(--deep));color:#fff;box-shadow:0 8px 30px rgba(var(--rgb),.4)}

  /* ---------- PROFILE CARD ---------- */
  .stage{position:relative;display:grid;place-items:center;min-height:460px}
  .orbit{
    position:absolute;width:420px;height:420px;border-radius:50%;
    border:1px dashed hsl(var(--h) var(--ls) 74% / .28);
    animation:spin 60s linear infinite;
  }
  .orbit::after{
    content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;border-radius:50%;
    background:var(--blue);box-shadow:0 0 18px var(--blue);
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .glow{
    position:relative;width:340px;
    transform:rotate(-4deg);
    filter:drop-shadow(0 24px 40px rgba(var(--rgb),.35)) drop-shadow(0 0 16px rgba(var(--rgb),.22));
  }
  .frame{
    aspect-ratio:1/1.05;padding:3px;
    background:linear-gradient(150deg,var(--blue-soft),rgba(var(--rgb),.3) 45%,var(--blue));
    border-radius:26px;
  }
  .profile{
    position:relative;width:100%;height:100%;overflow:hidden;
    border-radius:23px;
    background:linear-gradient(160deg,hsl(var(--h) var(--bs) 17%),hsl(var(--h) var(--bs) 7%));
    box-shadow:inset 0 0 60px rgba(var(--rgb),.25);
  }
  .profile img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}
  .profile__fallback{
    position:absolute;inset:0;display:none;place-items:center;
    font-family:"Anton";font-size:9rem;color:hsl(var(--h) var(--ls) 74% / .55);
    background:radial-gradient(circle at 50% 40%, rgba(var(--rgb),.4), transparent 65%);
  }
  .profile.no-img .profile__fallback{display:grid}
  .profile.no-img img{display:none}

  /* ---------- STATS ---------- */
  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:56px 0 0;
  }
  .stat{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 24px;
  }
  .stat strong{display:block;font-size:1.9rem;font-weight:900;line-height:1.2}
  .stat span{font-size:.82rem;color:var(--muted)}

  /* ---------- SOCIALS ---------- */
  .section{padding:88px 0 40px}
  .section h2{font-size:2.2rem;font-weight:900;direction:ltr;text-align:right}
  .section p.sub{color:var(--muted);margin-top:6px}
  .socials{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:32px;
  }
  .social{
    display:flex;align-items:center;gap:16px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;transition:border-color .2s, transform .2s;
  }
  .social:hover{border-color:var(--blue);transform:translateY(-3px)}
  .social__icon{
    width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
    background:rgba(var(--rgb),.18);color:var(--ice);
    flex:none;
  }
  .social__icon svg{width:24px;height:24px;fill:currentColor}
  .social b{display:block;font-size:1.02rem}
  .social small{color:var(--muted);direction:ltr;display:block;text-align:right}

  footer{
    margin-top:80px;border-top:1px solid var(--line);
    padding:28px 0;color:var(--muted);font-size:.85rem;text-align:center;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:900px){
    .hero__grid{grid-template-columns:1fr;gap:20px}
    .stage{order:-1;min-height:400px}
    .hero__name{text-align:center}
    .hero__ar,.actions,.tags{justify-content:center}
    .hero__copy{text-align:center}
    .stats{grid-template-columns:1fr}
    .nav__links a:not(.pill-kick){display:none}
    .nav__links{gap:10px}
    .theme{position:static}
    .theme__pop{position:fixed;top:76px;inset-inline:16px;width:auto}
  }
  @media (max-width:480px){
    .orbit{width:320px;height:320px}
    .glow{width:270px}
  }
  @media (prefers-reduced-motion:reduce){
    .orbit,.tag-top i{animation:none}
    .btn,.social{transition:none}
  }
</style>
</head>

<body>

<canvas id="fxBack" aria-hidden="true"></canvas>
<canvas id="fxFront" aria-hidden="true"></canvas>

<header class="nav">
  <div class="wrap">
    <nav class="nav__links">

      <div class="theme" id="theme">

</header>

const PRESETS = ["#2f6bff","#8b5cf6","#ec4899","#ef4444","#f97316","#eab308","#22c55e","#14b8a6","#06b6d4","#e5e7eb"];
const root = document.documentElement;
const THEME = { h: 222, rgb: "47,107,255" };

function hexToHsl(hex){
  const n = parseInt(hex.slice(1),16);
  const r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d){
    if(max===r) h=((g-b)/d)%6; else if(max===g) h=(b-r)/d+2; else h=(r-g)/d+4;
    h=Math.round(h*60); if(h<0) h+=360;
  }
  const l=(max+min)/2;
  const sat = d ? d/(1-Math.abs(2*l-1)) : 0;
  return {h, s:sat, l};
}

function applyColor(hex){
  const {h, s} = hexToHsl(hex);
  const n = parseInt(hex.slice(1),16);
  const r=n>>16&255, g=n>>8&255, b=n&255;
  const gray = s < 0.12;
  THEME.h = h; THEME.rgb = `${r},${g},${b}`;
  root.style.setProperty("--h", h);
  root.style.setProperty("--bs", gray ? "8%" : "65%");
  root.style.setProperty("--ls", gray ? "10%" : "100%");
  root.style.setProperty("--rgb", `${r},${g},${b}`);
  root.style.setProperty("--blue", hex);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  root.style.setProperty("--on-accent", lum > 0.6 ? "#0a0a0a" : "#fff");
  document.querySelectorAll(".swatch").forEach(el =>
    el.setAttribute("aria-pressed", el.dataset.c.toLowerCase() === hex.toLowerCase()));
  $("customColor").value = hex;
  try { localStorage.setItem("themeColor", hex); } catch(e) {}
}

const EFFECTS = ["stars", "starorbit", "planets", "meteors", "fireflies", "snow"];

const cb = $("fxBack"), cf = $("fxFront");
const bx = cb.getContext("2d"), fx = cf.getContext("2d");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W = 0, H = 0, raf = 0, last = 0;
let stars = [], flies = [], flakes = [], meteors = [], nextMeteor = 0;

const rnd = (a, b) => a + Math.random() * (b - a);

function seed(){
  stars  = Array.from({length: Math.round(W * H / 9000)}, () => ({x: rnd(0,W), y: rnd(0,H), r: rnd(.4,1.7), ph: rnd(0,6.28), sp: rnd(.6,2.2)}));
  flies  = Array.from({length: 28}, () => ({x: rnd(0,W), y: rnd(0,H), vx: rnd(-14,14), vy: rnd(-10,10), r: rnd(1.5,3.2), ph: rnd(0,6.28)}));
  flakes = Array.from({length: 90}, () => ({x: rnd(0,W), y: rnd(0,H), r: rnd(1,2.8), vy: rnd(22,60), sw: rnd(8,26), ph: rnd(0,6.28)}));
}

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  [cb, cf].forEach(c => { c.width = W * dpr; c.height = H * dpr; });
  bx.setTransform(dpr,0,0,dpr,0,0);
  fx.setTransform(dpr,0,0,dpr,0,0);
  seed();
  if (reduced) frame(performance.now());
}

function drawStars(t){
  stars.forEach(st => {
    const a = .3 + .7 * (Math.sin(t * st.sp + st.ph) + 1) / 2;
    bx.fillStyle = `hsla(${THEME.h},100%,92%,${a})`;
    bx.beginPath(); bx.arc(st.x, st.y, st.r, 0, 6.283); bx.fill();
    if (st.r > 1.4){
      bx.strokeStyle = `hsla(${THEME.h},100%,92%,${a * .55})`;
      bx.lineWidth = .6;
      bx.beginPath();
      bx.moveTo(st.x - st.r * 3.2, st.y); bx.lineTo(st.x + st.r * 3.2, st.y);
      bx.moveTo(st.x, st.y - st.r * 3.2); bx.lineTo(st.x, st.y + st.r * 3.2);
      bx.stroke();
    }
  });
}

function drawMeteors(dt, t){
  if (t > nextMeteor){
    meteors.push({x: rnd(W * .3, W * 1.05), y: rnd(-40, H * .35), life: 0, max: rnd(.7, 1.2), len: rnd(110, 200)});
    nextMeteor = t + rnd(1.2, 3.2);
  }
  meteors = meteors.filter(m => m.life < m.max);
  meteors.forEach(m => {
    m.life += dt;
    const k = m.life / m.max, sp = 900;
    m.x -= sp * .82 * dt; m.y += sp * .57 * dt;
    const tx = m.x + m.len * .82, ty = m.y - m.len * .57;
    const g = bx.createLinearGradient(m.x, m.y, tx, ty);
    const a = Math.sin(Math.min(1, k) * Math.PI);
    g.addColorStop(0, `hsla(${THEME.h},100%,95%,${a})`);
    g.addColorStop(1, `hsla(${THEME.h},100%,70%,0)`);
    bx.strokeStyle = g; bx.lineWidth = 2; bx.lineCap = "round";
    bx.beginPath(); bx.moveTo(m.x, m.y); bx.lineTo(tx, ty); bx.stroke();
  });
}

function drawFireflies(dt, t){
  flies.forEach(f => {
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.x < -10) f.x = W + 10;
    if (f.x > W + 10) f.x = -10;
    if (f.y < -10) f.y = H + 10;
    if (f.y > H + 10) f.y = -10;
    const a = .15 + .85 * (Math.sin(t * 1.4 + f.ph) + 1) / 2;
    const g = bx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 6);
    g.addColorStop(0, `rgba(${THEME.rgb},${a})`);
    g.addColorStop(1, `rgba(${THEME.rgb},0)`);
    bx.fillStyle = g;
    bx.beginPath(); bx.arc(f.x, f.y, f.r * 6, 0, 6.283); bx.fill();
    bx.fillStyle = `hsla(${THEME.h},100%,90%,${a})`;
    bx.beginPath(); bx.arc(f.x, f.y, f.r * .7, 0, 6.283); bx.fill();
  });
}

function drawSnow(dt, t){
  bx.fillStyle = "rgba(255,255,255,.75)";
  flakes.forEach(f => {
    f.y += f.vy * dt;
    f.x += Math.sin(t + f.ph) * f.sw * dt;
    if (f.y > H + 6){ f.y = -6; f.x = rnd(0, W); }
    bx.beginPath(); bx.arc(f.x, f.y, f.r, 0, 6.283); bx.fill();
  });
}

const PLANETS = [
  { rx: .60, ry: .17, tilt: -.32, w:  .32, size: 9,  dh: 150, ring: false, ph: 0.6 },
  { rx: .74, ry: .27, tilt:  .22, w: -.20, size: 20, dh: 30,  ring: true,  ph: 2.4 },
  { rx: .52, ry: .13, tilt:  .55, w:  .46, size: 6,  dh: 300, ring: false, ph: 4.4 }
];

function drawPlanet(c, x, y, size, hue, ring){
  const ringPath = (from, to) => {
    c.beginPath(); c.ellipse(x, y, size * 1.95, size * .55, -.42, from, to); c.stroke();
  };
  if (ring){
    c.lineWidth = size * .22; c.strokeStyle = `hsla(${hue},70%,72%,.55)`;
    ringPath(Math.PI, Math.PI * 2);
  }
  c.save();
  c.shadowColor = `hsla(${hue},90%,60%,.6)`; c.shadowBlur = size * 1.2;
  const g = c.createRadialGradient(x - size * .38, y - size * .38, size * .1, x, y, size);
  g.addColorStop(0, `hsl(${hue},85%,78%)`);
  g.addColorStop(.55, `hsl(${hue},70%,46%)`);
  g.addColorStop(1, `hsl(${hue},70%,14%)`);
  c.fillStyle = g;
  c.beginPath(); c.arc(x, y, size, 0, 6.283); c.fill();
  c.restore();
  if (ring){
    c.lineWidth = size * .22; c.strokeStyle = `hsla(${hue},70%,80%,.8)`;
    ringPath(0, Math.PI);
  }
}

function drawPlanets(t){
  const el = $("glow"), rc = el.getBoundingClientRect(), w = el.offsetWidth;
  const cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2;
  if (rc.bottom < -200 || rc.top > H + 200) return;
  PLANETS.forEach(p => {
    const a = t * p.w + p.ph;
    const lx = Math.cos(a) * p.rx * w, ly = Math.sin(a) * p.ry * w;
    const x = cx + lx * Math.cos(p.tilt) - ly * Math.sin(p.tilt);
    const y = cy + lx * Math.sin(p.tilt) + ly * Math.cos(p.tilt);
    const front = Math.sin(a) > 0;
    drawPlanet(front ? fx : bx, x, y, p.size * (w / 340), (THEME.h + p.dh) % 360, p.ring);
  });
}

const STAR_ORBITS = [
  { rx: .66, ry: .20, tilt:  .38, w:  .28, size: 7, ph: 1.0 },
  { rx: .66, ry: .20, tilt:  .38, w:  .28, size: 5, ph: 1.0 + Math.PI },
  { rx: .80, ry: .32, tilt: -.50, w: -.18, size: 9, ph: .3 },
  { rx: .80, ry: .32, tilt: -.50, w: -.18, size: 6, ph: .3 + 2.1 },
  { rx: .80, ry: .32, tilt: -.50, w: -.18, size: 5, ph: .3 + 4.2 },
  { rx: .56, ry: .12, tilt: -.15, w:  .40, size: 4, ph: 2.2 }
];

function drawSpark(c, x, y, size, alpha){
  c.save();
  c.translate(x, y);
  c.shadowColor = `hsla(${THEME.h},100%,70%,${alpha})`; c.shadowBlur = size * 2.4;
  c.fillStyle = `hsla(${THEME.h},100%,90%,${alpha})`;
  c.beginPath();
  for (let i = 0; i < 8; i++){
    const rad = i % 2 ? size * .34 : size;
    const ang = i * Math.PI / 4 - Math.PI / 2;
    c.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
  }
  c.closePath(); c.fill();
  c.restore();
}

function drawStarOrbit(t){
  const el = $("glow"), rc = el.getBoundingClientRect(), w = el.offsetWidth;
  const cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2;
  if (rc.bottom < -200 || rc.top > H + 200) return;
  const k = w / 340;
  STAR_ORBITS.forEach(p => {
    const at = a => {
      const lx = Math.cos(a) * p.rx * w, ly = Math.sin(a) * p.ry * w;
      return [cx + lx * Math.cos(p.tilt) - ly * Math.sin(p.tilt),
              cy + lx * Math.sin(p.tilt) + ly * Math.cos(p.tilt)];
    };
    const a = t * p.w + p.ph, dir = Math.sign(p.w);
    const c = Math.sin(a) > 0 ? fx : bx;
    for (let i = 6; i >= 1; i--){
      const [tx, ty] = at(a - dir * i * .07);
      c.fillStyle = `hsla(${THEME.h},100%,85%,${.32 * (1 - i / 7)})`;
      c.beginPath(); c.arc(tx, ty, p.size * k * .38 * (1 - i / 8), 0, 6.283); c.fill();
    }
    const [x, y] = at(a);
    drawSpark(c, x, y, p.size * k * (1 + .18 * Math.sin(t * 3 + p.ph)), .95);
  });
}

function frame(now){
  const t = now / 1000, dt = Math.min(.05, last ? t - last : .016);
  last = t;
  bx.clearRect(0, 0, W, H); fx.clearRect(0, 0, W, H);
  if (active.has("stars"))     drawStars(t);
  if (active.has("snow"))      drawSnow(dt, t);
  if (active.has("fireflies")) drawFireflies(dt, t);
  if (active.has("meteors"))   drawMeteors(dt, t);
  if (active.has("planets"))   drawPlanets(t);
  if (active.has("starorbit")) drawStarOrbit(t);
  if (!reduced && active.size) raf = requestAnimationFrame(frame);
}

function refreshFx(){
  cancelAnimationFrame(raf); last = 0;
  bx.clearRect(0, 0, W, H); fx.clearRect(0, 0, W, H);
  if (active.size) raf = requestAnimationFrame(frame);
  document.querySelectorAll(".chip").forEach(el =>
    el.setAttribute("aria-pressed", active.has(el.dataset.id)));
  try { localStorage.setItem("effects2", JSON.stringify([...active])); } catch(e) {}
}

$("chips").innerHTML = EFFECTS.map(id =>
  `<button type="button" class="chip" data-id="${id}" aria-pressed="false">${LABELS[id]}</button>`).join("");
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  active.has(b.dataset.id) ? active.delete(b.dataset.id) : active.add(b.dataset.id);
  refreshFx();
});

addEventListener("resize", resize);
resize();
refreshFx();

/* ---------- VISITOR COUNTER ---------- */
async function loadVisitors(){
  const c = SITE.counter;
  if (!c || !c.enabled) return;
  const isLocal = location.protocol === "file:" || ["localhost", "127.0.0.1", "[::1]", ""].includes(location.hostname);
  let hit = !isLocal;
  try { if (localStorage.getItem("visited")) hit = false; } catch(e) {}
  try {
    const res = await fetch(`https://abacus.jasoncameron.dev/${hit ? "hit" : "get"}/${c.namespace}/${c.key}`);
    let value = 0;
    if (res.ok) value = (await res.json()).value || 0;
    else if (res.status !== 404) return;
    $("viewCount").textContent = Number(value).toLocaleString("en");
    $("views").hidden = false;
    if (hit) { try { localStorage.setItem("visited", "1"); } catch(e) {} }
  } catch(e) {}
}
loadVisitors();
</script>
